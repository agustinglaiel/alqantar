<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Sin <title> estático a propósito: cada página renderiza el suyo vía
      <Seo> (src/components/ui/Seo.jsx), que React 19 sube al <head>
      automáticamente. Un <title> fijo acá conviviría con el de React —
      la spec de HTML usa el primer <title> del documento para
      document.title, así que el estático "ganaría" y el dinámico por
      ruta nunca se vería reflejado en la pestaña. Ver PLAN-REFACTOR.md
      §6 (F6) y CLAUDE.md para el caveat de SPA sin SSR: los crawlers que
      no ejecutan JS (WhatsApp, Facebook) tampoco ven este <title> dinámico.
    -->
    <script>
      // El hero sólo se renderiza en la home. Como es una SPA con un único index.html,
      // un <link rel=preload> estático dispararía en todas las rutas y bajaría hasta
      // 720 KB inútiles al entrar directo a /galeria. Este script corre en el <head>,
      // antes del bundle, así que conserva la ventaja del preload sin ese costo.
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.setAttribute(
          'imagesrcset',
          '/images/opt/01-400.webp 400w, /images/opt/01-800.webp 800w, /images/opt/01-1200.webp 1200w, /images/opt/01-1800.webp 1800w, /images/opt/01-2400.webp 2400w'
        );
        heroPreload.setAttribute('imagesizes', '100vw');
        heroPreload.setAttribute('fetchpriority', 'high');
        document.head.appendChild(heroPreload);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
